<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>交互计数器</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(145deg, #0f2b1d, #1d4e34 45%, #c6f6d5);
      color: #0b1f14;
    }
    .card {
      background: rgba(255,255,255,.92); padding: 2rem 2.4rem; border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,.18); text-align: center; min-width: 240px;
    }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    #n { font-size: 3.5rem; font-weight: 700; margin: .4rem 0 1rem; }
    .row { display: flex; gap: .6rem; justify-content: center; }
    button {
      border: 0; border-radius: 999px; padding: .7rem 1.1rem; font-size: 1rem;
      cursor: pointer; background: #146c43; color: #fff;
    }
    button.secondary { background: #d9eee3; color: #146c43; }
  </style>
</head>
<body>
  <div class="card">
    <h1>预置示例 · 计数器</h1>
    <div id="n">0</div>
    <div class="row">
      <button class="secondary" id="dec">−1</button>
      <button id="inc">+1</button>
      <button class="secondary" id="reset">重置</button>
    </div>
  </div>
  <script>
    let n = 0;
    const el = document.getElementById('n');
    const render = () => { el.textContent = String(n); };
    document.getElementById('inc').onclick = () => { n += 1; render(); };
    document.getElementById('dec').onclick = () => { n -= 1; render(); };
    document.getElementById('reset').onclick = () => { n = 0; render(); };
  </script>
</body>
</html>
