<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一题小测</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Lucida Grande", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #312e81, #7c3aed 40%, #f5d0fe);
      color: #1e1b4b;
    }
    .box {
      width: min(440px, 92vw); background: rgba(255,255,255,.94);
      border-radius: 20px; padding: 1.5rem; box-shadow: 0 20px 50px rgba(49,46,129,.35);
    }
    h1 { margin: 0 0 .4rem; font-size: 1.2rem; }
    p { margin: 0 0 1rem; line-height: 1.5; }
    .opts { display: grid; gap: .55rem; }
    button {
      text-align: left; border: 1px solid #c4b5fd; background: #f5f3ff;
      border-radius: 12px; padding: .75rem 1rem; cursor: pointer; font: inherit;
    }
    button:hover { background: #ede9fe; }
    #msg { margin-top: 1rem; font-weight: 600; min-height: 1.4em; }
    .ok { color: #15803d; }
    .bad { color: #b91c1c; }
  </style>
</head>
<body>
  <div class="box">
    <h1>一题小测</h1>
    <p>在 Atoms 里，怎样进入自己的项目列表？</p>
    <div class="opts">
      <button data-ok="0">必须完成第三方授权登录</button>
      <button data-ok="1">填写邮箱即可进入</button>
      <button data-ok="0">必须绑定手机号</button>
    </div>
    <div id="msg"></div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    document.querySelectorAll('.opts button').forEach((btn) => {
      btn.onclick = () => {
        const ok = btn.getAttribute('data-ok') === '1';
        msg.className = ok ? 'ok' : 'bad';
        msg.textContent = ok ? '正确：登录 = 邮箱登记。' : '不对，再选一次。';
      };
    });
  </script>
</body>
</html>
